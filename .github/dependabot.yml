# Dependabot propose les montées sur dev (qui reçoit tout), vérifiées par la CI GitHub.
# Aucun délai (cooldown) : exclude "*" y soustrait toutes les dépendances. Changelog lu avant chaque fusion.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    cooldown:
      exclude: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    cooldown:
      exclude: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    cooldown:
      exclude: ["*"]
