# Dépôt privé : pas de CI GitHub. Dependabot propose les montées sur dev (qui reçoit tout) ;
# Aucun délai (cooldown) : exclude "*" y soustrait toutes les dépendances. Chaque PR passe par la routine locale (changelog lu, scripts/ci.sh) avant fusion.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    cooldown:
      exclude: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    cooldown:
      exclude: ["*"]
