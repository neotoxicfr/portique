[workspace]
resolver = "3"
members = ["crates/proto", "crates/rdp-auth", "crates/rdp-clip", "crates/rdp-codecs", "crates/rdp-connect", "crates/rdp-gfx", "crates/rdp-pdu", "crates/rdp-probe", "crates/rdp-session", "crates/server", "crates/web"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
portique-proto = { path = "crates/proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.2", features = ["serde"] }
webauthn-rs-proto = "0.6.2"

# Dépendances sans infos de débogage, notre code avec les numéros de ligne seulement :
# `target/` passe de plusieurs Go à quelques centaines de Mo.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.portique-web]
opt-level = "z"
