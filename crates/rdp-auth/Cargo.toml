[package]
name = "rdp-auth"
description = "Authentification RDP sans I/O : NTLMv2 (MS-NLMP) et CredSSP (MS-CSSP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Primitives RustCrypto : aucune crypto n'est écrite ici, seulement les messages.
md4 = { version = "0.11.0", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
rc4 = { version = "0.2.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
