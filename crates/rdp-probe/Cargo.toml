[package]
name = "rdp-probe"
description = "Sonde de connexion : négociation, TLS, NLA et capacités annoncées par un serveur RDP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rdp-auth = { path = "../rdp-auth" }
rdp-pdu = { path = "../rdp-pdu" }
rdp-session = { path = "../rdp-session" }
rdp-gfx = { path = "../rdp-gfx" }
png = "0.18.1"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["macros", "rt", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
rand = "0.10.3"
hex = "0.4.3"
