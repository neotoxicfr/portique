[package]
name = "yawrdp-server"
description = "Serveur yawrdp : comptes, connexions, relais RDP"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "yawrdp"
path = "src/main.rs"

[dependencies]
yawrdp-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rdp-connect = { path = "../rdp-connect" }
rdp-auth = { path = "../rdp-auth" }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "set-header"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

argon2 = "0.6.0"
totp-rs = { version = "6.0.0", features = ["otpauth"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
webauthn-rs = "0.5.5"
# webauthn-rs passe par OpenSSL : compilé depuis les sources pour ne dépendre d'aucun paquet système.
openssl = { version = "0.10.81", features = ["vendored"] }
chacha20poly1305 = "0.11.0"
rand = "0.10.3"
sha2 = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
ipnet = "2.12.2"
url = "2"
time = { version = "0.3.55", features = ["formatting"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
totp-rs = "6.0.0"
