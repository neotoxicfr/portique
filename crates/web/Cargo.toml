[package]
name = "yawrdp-web"
description = "Front yawrdp (Leptos CSR, wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yawrdp-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
webauthn-rs-proto = { workspace = true, features = ["wasm"] }

rdp-clip = { path = "../rdp-clip" }
rdp-gfx = { path = "../rdp-gfx" }
rdp-pdu = { path = "../rdp-pdu" }
rdp-session = { path = "../rdp-session" }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

leptos = { version = "0.8.22", features = ["csr"] }
leptos_router = "0.8.17"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
    "Window",
    "Navigator",
    "Storage",
    "CredentialsContainer",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    "PublicKeyCredential",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "ImageData",
    "Location",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "FocusEvent",
    "DomRect",
    "DomRectReadOnly",
    "AddEventListenerOptions",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "VideoDecoderSupport",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "VideoFrame",
    "VideoFrameCopyToOptions",
    "PlaneLayout",
    "VideoPixelFormat",
    "HardwareAcceleration",
    "CodecState",
    "Clipboard",
    "ClipboardItem",
    "Blob",
    "BlobPropertyBag",
    "ImageBitmap",
] }
console_error_panic_hook = "0.1.7"
