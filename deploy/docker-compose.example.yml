# Exemple : portique derrière Traefik + Authelia (mode proxy), dans l'espace réseau d'un conteneur
# WireGuard qui joint le réseau du PC (ici `wireguard`). Secrets en fichiers (Docker secrets).
# Compose résout `./data` et `./secrets` depuis le dossier de ce fichier : les commandes de préparation
# ci-dessous se lancent dans ce dossier. Docker rootless ou userns-remap : UID décalé sur l'hôte, voir le README.
services:
  portique:
    image: portique:0.1.0
    container_name: portique
    network_mode: "container:wireguard"   # le PC n'est joignable que par ce tunnel
    environment:
      PORTIQUE_LISTEN: 0.0.0.0:8090        # 8080-8083 déjà pris dans cet espace réseau
      PORTIQUE_PUBLIC_URL: https://portique.example.net
      PORTIQUE_AUTH_MODE: proxy
      PORTIQUE_TRUSTED_PROXIES: traefik    # nom résolu toutes les 10 s (IP Docker non fixe), valable 60 s
      PORTIQUE_PROXY_ADMIN_GROUP: admin
      PORTIQUE_MASTER_KEY_FILE: /run/secrets/master_key
    secrets:
      - master_key
    volumes:
      - ./data:/data                     # à créer avant : sudo install -d -m 700 -o 10001 -g 10001 data (UID de l'image)
    read_only: true
    security_opt:
      - no-new-privileges=true
    cap_drop: [ALL]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

secrets:
  master_key:
    # Compose monte le fichier avec les droits de l'hôte : il doit être lisible par l'UID 10001 de l'image,
    # qui ne doit être celui d'aucun compte de l'hôte (ce compte lirait la clé et la base ; sinon userns-remap).
    # Jamais régénérée sur une installation existante : une nouvelle clé ne déchiffrerait plus la base.
    # (umask 077; mkdir -p secrets && { [ -s secrets/master_key ] || openssl rand -base64 32 > secrets/master_key; }) \
    #   && chmod 400 secrets/master_key && sudo chown 10001 secrets/master_key
    file: ./secrets/master_key

# Route Traefik (fichier dynamique, le conteneur partageant le réseau de wireguard) :
# http:
#   routers:
#     portique:
#       rule: Host(`portique.example.net`)
#       service: portique
#       middlewares: [admin-chain-app]    # Authelia devant ; la CSP de portique n'est pas écrasée
#   services:
#     portique:
#       loadBalancer:
#         servers:
#           - url: http://wireguard:8090
